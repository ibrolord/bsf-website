name: Annotator QA

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      report_id:
        description: Annotate report id to verify
        required: false
      target_url:
        description: Optional deployed URL to test instead of the captured URL
        required: false

permissions:
  contents: read
  pull-requests: write

env:
  ANNOTATE_API_URL: https://annotate-api-production.up.railway.app
  ANNOTATOR_QA_SCRIPT_REF: main

jobs:
  annotator-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Download Annotate QA runner
        run: |
          mkdir -p .annotator-qa
          curl -fsSL "https://raw.githubusercontent.com/ibrolord/annotator-qa-runner/$ANNOTATOR_QA_SCRIPT_REF/scripts/qa/resolve-report-id.mjs" -o .annotator-qa/resolve-report-id.mjs
          curl -fsSL "https://raw.githubusercontent.com/ibrolord/annotator-qa-runner/$ANNOTATOR_QA_SCRIPT_REF/scripts/qa/run-verification.mjs" -o .annotator-qa/run-verification.mjs

      - name: Resolve Annotate report
        id: report
        run: node .annotator-qa/resolve-report-id.mjs
        env:
          ANNOTATE_REPORT_ID: ${{ inputs.report_id || '' }}

      - name: Run Annotate verification
        id: verify
        if: steps.report.outputs.report_found == 'true'
        run: node .annotator-qa/run-verification.mjs
        env:
          ANNOTATE_RUNNER_TOKEN: ${{ secrets.ANNOTATOR_QA_RUNNER_TOKEN }}
          ANNOTATE_REPORT_ID: ${{ steps.report.outputs.report_id }}
          ANNOTATE_TARGET_URL: ${{ inputs.target_url || vars.ANNOTATOR_QA_TARGET_URL || '' }}
          ANNOTATE_PLAYWRIGHT_COMMAND: npx playwright test

      - name: Comment verification result
        if: github.event_name == 'pull_request' && steps.report.outputs.report_found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const status = process.env.STATUS || 'unknown';
            const runId = process.env.RUN_ID || 'unknown';
            const summary = process.env.SUMMARY || 'Annotate verification finished.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                'Annotate QA verification: **' + status + '**',
                '',
                summary,
                '',
                'Report ID: ' + process.env.REPORT_ID,
                'Verification run: ' + runId
              ].join('\n')
            });
        env:
          STATUS: ${{ steps.verify.outputs.status }}
          SUMMARY: ${{ steps.verify.outputs.result_summary }}
          REPORT_ID: ${{ steps.report.outputs.report_id }}
          RUN_ID: ${{ steps.verify.outputs.verification_run_id }}
