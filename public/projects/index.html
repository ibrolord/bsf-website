<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Projects — Big Sister Foundation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --iroko:#2D5E40; --iroko-dark:#1E3F2B; --brown:#3A2A1F; --terra:#C2734C;
    --gold:#D4A96A; --sage:#8BAF8E; --cream:#FFF8F0; --paper:#FAF7F2;
    --line:#E7E0D5; --muted:#6b5d50; --ok:#3f8f5f; --warn:#C2734C; --danger:#b5442f;
    --shadow:0 2px 10px rgba(30,63,43,.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--brown);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.5;}
  h1,h2,h3,h4{font-family:'EB Garamond',Georgia,serif;color:var(--iroko);margin:0;font-weight:600;}
  a{color:var(--terra);text-decoration:none;}
  button{font:inherit;cursor:pointer;border:none;border-radius:8px;}
  .btn{padding:8px 14px;border-radius:8px;font-size:14px;font-weight:600;background:var(--iroko);color:#fff;transition:.15s;}
  .btn:hover{background:var(--iroko-dark);}
  .btn.secondary{background:#fff;color:var(--iroko);border:1px solid var(--line);}
  .btn.secondary:hover{background:var(--cream);}
  .btn.danger{background:#fff;color:var(--danger);border:1px solid #eecdc6;}
  .btn.danger:hover{background:#fdf1ee;}
  .btn.xs{padding:4px 9px;font-size:12px;}
  .btn:disabled{opacity:.55;cursor:not-allowed;}

  header.topbar{background:var(--iroko);color:var(--cream);padding:14px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20;}
  header.topbar .mark{width:30px;height:34px;flex-shrink:0;}
  header.topbar .brand{font-family:'EB Garamond',Georgia,serif;font-size:19px;color:var(--cream);line-height:1;}
  header.topbar .brand small{display:block;font-family:system-ui,sans-serif;font-size:9.5px;letter-spacing:3px;color:var(--gold);margin-top:4px;}
  header.topbar .spacer{flex:1;}
  header.topbar .who{font-size:12.5px;color:rgba(255,255,255,.8);}
  header.topbar a.exit{color:var(--gold);font-size:13px;}

  .wrap{max-width:1120px;margin:0 auto;padding:26px 22px 80px;}
  .gate{max-width:420px;margin:12vh auto;text-align:center;color:var(--muted);}
  .hidden{display:none!important;}

  .page-head{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
  .page-head h1{font-size:30px;}
  .page-head .spacer{flex:1;}
  .crumb{background:none;color:var(--muted);font-size:13.5px;padding:6px 0;}
  .crumb:hover{color:var(--iroko);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);}
  .pcard{cursor:pointer;transition:.15s;}
  .pcard:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(30,63,43,.12);border-color:var(--sage);}
  .pcard h3{font-size:20px;margin-bottom:4px;}
  .pcard .meta{font-size:12.5px;color:var(--muted);margin-top:10px;display:flex;gap:14px;flex-wrap:wrap;}

  .chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:capitalize;}
  .chip.planning{background:#eef2ee;color:#4a6b54;}
  .chip.active{background:#e4f0e8;color:var(--ok);}
  .chip.paused{background:#faf0e4;color:var(--warn);}
  .chip.done{background:#eae4f0;color:#6b4f8f;}
  .chip.pri-urgent{background:#fbe6e0;color:var(--danger);}
  .chip.pri-high{background:#faf0e4;color:var(--warn);}
  .chip.pri-medium{background:#eef2ee;color:#4a6b54;}
  .chip.pri-low{background:#eef1f4;color:#5b6470;}

  .budgetbar{height:9px;border-radius:6px;background:#eee6da;overflow:hidden;margin-top:8px;}
  .budgetbar > span{display:block;height:100%;background:var(--iroko);}
  .budgetbar.over > span{background:var(--danger);}

  .detail-head{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px;}
  .detail-head h1{font-size:28px;}
  .detail-head .sub{color:var(--muted);font-size:13.5px;margin-top:8px;display:flex;gap:18px;flex-wrap:wrap;}
  .detail-head .brief{margin-top:14px;white-space:pre-wrap;line-height:1.65;}

  .section{margin-top:22px;}
  .section > h2{font-size:21px;margin-bottom:12px;display:flex;align-items:center;gap:10px;}
  .section > h2 .spacer{flex:1;}

  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .col{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;min-height:80px;}
  .col > h4{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:10px;font-family:system-ui,sans-serif;font-weight:700;}
  .task{background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:9px;}
  .task .t-title{font-weight:600;font-size:14px;margin-bottom:6px;}
  .task .t-meta{font-size:11.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .task.draggable{cursor:grab;}
  .task.draggable:active{cursor:grabbing;}
  .task.dragging{opacity:.45;}
  .col.drop-over{background:rgba(45,94,64,0.06);outline:2px dashed var(--iroko);outline-offset:-4px;}
  .task .t-actions{margin-top:7px;display:flex;gap:6px;}

  .rowlist .row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .rowlist .row:last-child{border-bottom:none;}
  .rowlist .row .spacer{flex:1;}
  .muted{color:var(--muted);}
  .empty{color:var(--muted);font-size:13.5px;padding:14px;text-align:center;border:1px dashed var(--line);border-radius:10px;}

  .stat{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:10px;}
  .stat .s{}
  .stat .s .v{font-family:'EB Garamond',serif;font-size:26px;color:var(--iroko);font-weight:700;}
  .stat .s .l{font-size:12px;color:var(--muted);}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(30,63,43,.4);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .modal{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .modal h3{font-size:22px;margin-bottom:16px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--paper);}
  .field textarea{min-height:88px;resize:vertical;}
  .field.two{display:flex;gap:12px;}
  .field.two > div{flex:1;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

  /* toast */
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--brown);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;z-index:100;opacity:0;transition:.25s;pointer-events:none;}
  #toast.show{opacity:1;}
  #toast.error{background:var(--danger);}

  .ext-badge{font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;background:#faf0e4;color:var(--warn);text-transform:uppercase;letter-spacing:.3px;margin-left:6px;}
  .bplan{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px;}
  .bplan td,.bplan th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;}
  .bplan th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;}
  .bplan td.num,.bplan th.num{text-align:right;white-space:nowrap;}
  .bplan tr.committed td{color:var(--muted);}
  .chat{max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:10px;}
  .chat-msg{background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:9px 12px;}
  .chat-msg .meta{font-size:11px;color:var(--muted);margin-bottom:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .chat-msg .body{font-size:14px;white-space:pre-wrap;word-break:break-word;}
  .composer{display:flex;gap:8px;margin-top:12px;}
  .composer textarea{flex:1;min-height:44px;max-height:160px;padding:8px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--paper);resize:vertical;}
  .checklist{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 11px;background:var(--paper);}
  .checklist label{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:400;color:var(--brown);margin:0 0 4px;cursor:pointer;}
  .checklist input{width:auto;}
  .section > h2 .btn{margin-left:6px;}
  @media(max-width:820px){ .board{grid-template-columns:1fr 1fr;} }
  @media(max-width:520px){ .board{grid-template-columns:1fr;} }
</style>
</head>
<body>

<header class="topbar">
  <svg class="mark" viewBox="0 0 34 40" aria-hidden="true">
    <ellipse cx="17" cy="13" rx="14" ry="11" fill="#8BAF8E"/>
    <ellipse cx="11" cy="11" rx="9" ry="8" fill="#FFF8F0" opacity="0.92"/>
    <ellipse cx="21" cy="14" rx="9" ry="8" fill="#E8EFE6" opacity="0.85"/>
    <rect x="15.5" y="20" width="3" height="16" fill="#3A2A1F"/>
  </svg>
  <div class="brand">Projects<small>PLANNING &amp; DELIVERY</small></div>
  <div class="spacer"></div>
  <span class="who" id="who"></span>
  <a class="exit" href="/volunteer/dashboard/">← Dashboard</a>
</header>

<div id="gate" class="gate">Loading…</div>

<main id="app" class="wrap hidden">

  <!-- LIST VIEW -->
  <section id="view-list">
    <div class="page-head">
      <h1>Projects</h1>
      <div class="spacer"></div>
      <label class="muted" style="font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="show-archived" onchange="toggleArchived(this.checked)" style="width:auto"> Show archived</label>
      <button class="btn lead-only hidden" id="btn-new-project" onclick="openProjectModal(null)">+ New Project</button>
    </div>
    <div id="projects-grid" class="grid"></div>
  </section>

  <!-- DETAIL VIEW -->
  <section id="view-detail" class="hidden">
    <button class="crumb" onclick="showList()">← All projects</button>
    <div id="detail-body"></div>
  </section>

</main>

<div id="modal-root"></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ========== FIREBASE INIT ==========
var firebaseConfig = {
  apiKey: "AIzaSyCwos6XR9-uqAf_Esmh2K_hJoLxq4gnEuU",
  authDomain: "big-sister-foundation.firebaseapp.com",
  projectId: "big-sister-foundation",
  storageBucket: "big-sister-foundation.firebasestorage.app",
  messagingSenderId: "778723584560",
  appId: "1:778723584560:web:7499944c30001e7fcf5bf5",
  measurementId: "G-Q4EYY24EDZ"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();
var db = firebase.firestore();

// ========== STATE ==========
var SUPER_EMAILS = ['admin@bigsisterfoundation.org','bsfadmin@bigsisterfoundation.org','princebolajibreeze@gmail.com','bolajiagunbiade1@gmail.com'];
var STATUS_ORDER = ['open','in_progress','completed','blocked'];
var STATUS_LABEL = { open:'Open', in_progress:'In progress', completed:'Completed', blocked:'Blocked' };
var currentUser = null, currentEmail = '', userRoles = [], userPerms = [], userOverrides = {};
var projectsCache = [];
var showArchived = false;
var volunteersCache = null, schoolsCache = null;
var current = null; // { id, data, tasks, ledger, events }

// Client mirror of auth.js ROLE_PERMISSIONS for the keys this page gates on.
// The server (mutate.js) is the real enforcer; this only hides buttons that would 403.
var ROLE_PERMS = {
  admin:        ['projects.create','projects.edit','projects.delete','projects.manage_members','tasks.assign','events.edit','events.create','ledger.edit','outreach.edit','outreach.create'],
  superadmin:   ['projects.create','projects.edit','projects.delete','projects.manage_members','tasks.assign','events.edit','events.create','ledger.edit','outreach.edit','outreach.create'],
  program_lead: ['projects.create','projects.edit','projects.delete','projects.manage_members','tasks.assign','events.edit','events.create','outreach.edit','outreach.create'],
  team_lead:    ['projects.create','projects.edit','projects.manage_members','tasks.assign'],
  finance:      ['ledger.edit']
};
function can(perm){
  if(SUPER_EMAILS.indexOf(currentEmail) > -1) return true;
  // explicit per-user override wins over role/stored grants (mirrors auth.js resolveAllowedPermission)
  if(userOverrides && (perm in userOverrides)) return userOverrides[perm] === true;
  if(userPerms.indexOf(perm) > -1) return true;
  return userRoles.some(function(r){ return (ROLE_PERMS[r]||[]).indexOf(perm) > -1; });
}

// ========== HELPERS ==========
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function money(n){ var v = Number(n)||0; return '₦' + v.toLocaleString('en-NG'); }
function fmtDate(v){ if(!v) return '—'; try{ var d = v && v.toDate ? v.toDate() : new Date(v); if(isNaN(d.getTime())) return String(v); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }catch(e){ return String(v); } }
function toast(msg, type){ var t=document.getElementById('toast'); t.textContent=msg; t.className='show'+(type==='error'?' error':''); setTimeout(function(){ t.className=''; }, 3200); }
function el(id){ return document.getElementById(id); }

async function callApi(payload){
  if(!currentUser){ throw new Error('Not signed in.'); }
  var token = await currentUser.getIdToken();
  var res = await fetch('/api/admin/mutate', { method:'POST', headers:{ 'Authorization':'Bearer '+token, 'Content-Type':'application/json' }, body: JSON.stringify(payload||{}) });
  var data = null; try{ data = await res.json(); }catch(_e){}
  if(!res.ok){ var msg = data && data.error && data.error.message ? data.error.message : 'Request failed ('+res.status+')'; throw new Error(msg); }
  return data || { ok:true };
}

function closeModal(){ el('modal-root').innerHTML=''; }
function openModal(html){ el('modal-root').innerHTML = '<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">'+html+'</div></div>'; }

// ========== AUTH ==========
auth.onAuthStateChanged(function(user){
  if(!user){ window.location.href = '/signin/'; return; }
  currentUser = user;
  currentEmail = (user.email||'').toLowerCase();
  db.collection('users').doc(currentEmail).get().then(function(doc){
    var d = doc.exists ? (doc.data()||{}) : {};
    userRoles = Array.isArray(d.roles) ? d.roles : (d.role ? [d.role] : []);
    userPerms = Array.isArray(d.permissions) ? d.permissions : [];
    userOverrides = (d.permission_overrides || d.permissionOverrides || {});
    el('who').textContent = currentEmail;
    el('gate').classList.add('hidden');
    el('app').classList.remove('hidden');
    document.querySelectorAll('.lead-only').forEach(function(n){ n.classList.toggle('hidden', !can('projects.create')); });
    loadProjects();
  }).catch(function(e){
    el('gate').textContent = 'Could not load your account: ' + e.message;
  });
});

// ========== LIST ==========
function loadProjects(){
  var grid = el('projects-grid');
  grid.innerHTML = '<p class="muted">Loading projects…</p>';
  db.collection('projects').orderBy('createdAt','desc').get().then(function(snap){
    projectsCache = [];
    snap.forEach(function(doc){ var d = doc.data()||{}; d._id = doc.id; projectsCache.push(d); });
    renderProjects();
  }).catch(function(e){
    grid.innerHTML = '<p class="muted">Unable to load projects: '+esc(e.message)+'</p>';
  });
}

function renderProjects(){
  var grid = el('projects-grid');
  var visible = projectsCache.filter(function(p){ return showArchived ? true : !p.archived; });
  if(!visible.length){
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1">'+
      (projectsCache.length ? 'No '+(showArchived?'':'active ')+'projects.' : 'No projects yet.'+(can('projects.create')?' Click “New Project” to create one.':''))+'</div>';
    return;
  }
  grid.innerHTML = '';
  visible.forEach(function(p){
    var members = Array.isArray(p.members) ? p.members.length : 0;
    var schoolList = (Array.isArray(p.schoolNames) && p.schoolNames.length) ? p.schoolNames : (p.schoolName ? [p.schoolName] : []);
    var card = document.createElement('div');
    card.className = 'card pcard';
    if(p.archived) card.style.opacity = '0.62';
    card.onclick = function(){ openProject(p._id); };
    card.innerHTML =
      '<div style="display:flex;align-items:flex-start;gap:8px"><h3 style="flex:1">'+esc(p.name)+'</h3>'+
      (p.archived?'<span class="chip" style="background:#e8e5df;color:#7a7267">archived</span> ':'')+
      '<span class="chip '+esc(p.status||'planning')+'">'+esc(p.status||'planning')+'</span></div>'+
      (p.brief ? '<p class="muted" style="font-size:13px;margin:6px 0 0">'+esc(String(p.brief).slice(0,120))+(String(p.brief).length>120?'…':'')+'</p>' : '')+
      '<div class="meta">'+
        '<span>👤 '+esc(p.leadName||'No lead')+'</span>'+
        '<span>👥 '+members+' member'+(members===1?'':'s')+'</span>'+
        (p.dueDate ? '<span>📅 due '+esc(fmtDate(p.dueDate))+'</span>' : '')+
        (p.budgetTarget!=null ? '<span>💰 '+esc(money(p.budgetTarget))+'</span>' : '')+
        (schoolList.length ? '<span>🏫 '+esc(schoolList.join(', '))+'</span>' : '')+
      '</div>';
    grid.appendChild(card);
  });
}

function showList(){ el('view-detail').classList.add('hidden'); el('view-list').classList.remove('hidden'); current=null; }

// ========== DETAIL ==========
function openProject(id){
  el('view-list').classList.add('hidden');
  el('view-detail').classList.remove('hidden');
  el('detail-body').innerHTML = '<p class="muted">Loading…</p>';
  db.collection('projects').doc(id).get().then(function(doc){
    if(!doc.exists){ el('detail-body').innerHTML = '<div class="empty">Project not found.</div>'; return; }
    current = { id:id, data:(doc.data()||{}), tasks:[], ledger:[], events:[], outreach:[], files:[], comments:[], budgetItems:[] };
    renderDetail();
    loadTasks();
    loadBudgetItems();
    loadBudget();
    loadLinkedEvents();
    loadLinkedOutreach();
    loadFiles();
    loadComments();
  }).catch(function(e){ el('detail-body').innerHTML = '<div class="empty">'+esc(e.message)+'</div>'; });
}

function renderDetail(){
  var p = current.data;
  var schoolList = (Array.isArray(p.schoolNames) && p.schoolNames.length) ? p.schoolNames : (p.schoolName ? [p.schoolName] : []);
  var leadBtns = (can('projects.edit') ? '<button class="btn secondary xs" onclick="openProjectModal(current.id)">Edit</button> ' : '')
    + (can('projects.edit') ? (p.archived
        ? '<button class="btn secondary xs" onclick="archiveProject(false)">Unarchive</button>'
        : '<button class="btn secondary xs" onclick="archiveProject(true)">Archive</button>') : '');
  var html =
    '<div class="detail-head">'+
      '<div style="display:flex;align-items:flex-start;gap:12px">'+
        '<h1 style="flex:1">'+esc(p.name)+'</h1>'+
        (p.archived?'<span class="chip" style="background:#e8e5df;color:#7a7267">archived</span>':'')+
        '<span class="chip '+esc(p.status||'planning')+'">'+esc(p.status||'planning')+'</span>'+
      '</div>'+
      '<div class="sub">'+
        '<span>Lead: <strong>'+esc(p.leadName||'—')+'</strong></span>'+
        (p.startDate?'<span>Start: '+esc(fmtDate(p.startDate))+'</span>':'')+
        (p.dueDate?'<span>Due: '+esc(fmtDate(p.dueDate))+'</span>':'')+
        (schoolList.length?'<span>🏫 '+(schoolList.length>1?'Schools':'School')+': <strong>'+schoolList.map(function(n){return esc(n);}).join(', ')+'</strong></span>':'')+
      '</div>'+
      (p.brief?'<div class="brief">'+esc(p.brief)+'</div>':'')+
      (leadBtns?'<div style="margin-top:14px">'+leadBtns+'</div>':'')+
    '</div>'+

    // PEOPLE (volunteers + externals)
    '<div class="section"><h2>People <span class="spacer"></span>'+
      (can('projects.manage_members')?'<button class="btn secondary xs" onclick="openMemberPicker()">+ Volunteer</button>'+
        '<button class="btn secondary xs" onclick="openExternalModal()">+ External</button>'+
        '<button class="btn secondary xs" onclick="openInviteModal()">Invite by email</button>':'')+'</h2>'+
      '<div class="card"><div class="rowlist" id="members-list"></div></div></div>'+

    // TASKS
    '<div class="section"><h2>Tasks <span class="spacer"></span>'+
      (can('tasks.assign')?'<button class="btn secondary xs" onclick="openTaskModal(null)">+ Assign task</button>':'')+'</h2>'+
      '<div class="board" id="task-board"><p class="muted">Loading tasks…</p></div></div>'+

    // BUDGET (draft plan + committed ledger)
    '<div class="section"><h2>Budget <span class="spacer"></span>'+
      (can('projects.edit')?'<button class="btn secondary xs" onclick="openBudgetItemModal(null)">+ Budget line</button>':'')+

function loadTasks(){
  db.collection('tasks').where('projectId','==',current.id).get().then(function(snap){
    current.tasks = []; snap.forEach(function(doc){ var d=doc.data()||{}; d._id=doc.id; current.tasks.push(d); });
    renderTasks();
  }).catch(function(e){ var b=el('task-board'); if(b) b.innerHTML='<p class="muted">Unable to load tasks: '+esc(e.message)+'</p>'; });
}

var draggingTaskId = null;
function renderTasks(){
  var board = el('task-board'); if(!board) return;
  board.innerHTML = '';
  STATUS_ORDER.forEach(function(st){
    var col = document.createElement('div'); col.className='col'; col.dataset.status = st;
    var items = current.tasks.filter(function(t){ return (t.status||'open')===st; });
    col.innerHTML = '<h4>'+STATUS_LABEL[st]+' ('+items.length+')</h4>';
    items.forEach(function(t){ col.appendChild(taskCard(t)); });
    col.addEventListener('dragover', function(ev){ if(!draggingTaskId) return; ev.preventDefault(); if(ev.dataTransfer) ev.dataTransfer.dropEffect='move'; col.classList.add('drop-over'); });
    col.addEventListener('dragleave', function(ev){ if(ev.target===col) col.classList.remove('drop-over'); });
    col.addEventListener('drop', function(ev){
      ev.preventDefault(); col.classList.remove('drop-over');
      var id = draggingTaskId || (ev.dataTransfer && ev.dataTransfer.getData('text/plain'));
      if(!id) return;
      var task = current.tasks.filter(function(x){ return x._id===id; })[0];
      if(!task || (task.status||'open')===st) return;
      updateTaskStatus(task, st);
    });
    board.appendChild(col);
  });
}

function taskCard(t){
  var d = document.createElement('div'); d.className='task';
  var canStatus = can('tasks.assign') || (t.assigneeEmail && t.assigneeEmail === currentEmail);
  var html = '<div class="t-title">'+esc(t.title||'Untitled')+'</div>'+
    '<div class="t-meta"><span class="chip pri-'+esc(t.priority||'medium')+'">'+esc(t.priority||'medium')+'</span>'+
    (t.assigneeName?'<span>👤 '+esc(t.assigneeName)+'</span>':'<span class="muted">Unassigned</span>')+
    (t.dueDate?'<span>📅 '+esc(fmtDate(t.dueDate))+'</span>':'')+'</div>';
  d.innerHTML = html;
  if(canStatus){
    d.setAttribute('draggable','true');
    d.classList.add('draggable');
    d.title = 'Drag to another column to change status';
    d.addEventListener('dragstart', function(ev){ draggingTaskId = t._id; d.classList.add('dragging'); if(ev.dataTransfer){ ev.dataTransfer.effectAllowed='move'; ev.dataTransfer.setData('text/plain', t._id); } });
    d.addEventListener('dragend', function(){ draggingTaskId = null; d.classList.remove('dragging'); document.querySelectorAll('.col.drop-over').forEach(function(c){ c.classList.remove('drop-over'); }); });
  }
  if(can('tasks.assign')){
    var actions = document.createElement('div'); actions.className='t-actions';
    var be=document.createElement('button'); be.className='btn secondary xs'; be.textContent='Edit'; be.onclick=function(){ openTaskModal(t); };
    var bd=document.createElement('button'); bd.className='btn danger xs'; bd.textContent='Delete'; bd.onclick=function(){ deleteTask(t); };
    actions.appendChild(be); actions.appendChild(bd); d.appendChild(actions);
  }
  return d;
}

// Self / assignee status change stays client-side (preserves existing task flow);
// leads route through the audited API so delegation changes are logged.
function updateTaskStatus(t, status){
  if(can('tasks.assign')){
    callApi({ action:'task.save', taskId:t._id, projectId:current.id, title:t.title, description:t.description||'', status:status, priority:t.priority||'medium', assigneeId:t.assigneeId||'', dueDate:t.dueDate||'' })
      .then(function(){ toast('Task updated.'); loadTasks(); }).catch(function(e){ toast(e.message,'error'); loadTasks(); });
    return;
  }
  var update = {
    status: status,
    completedAt: status==='completed' ? firebase.firestore.FieldValue.serverTimestamp() : null,
    lastEditedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  db.collection('tasks').doc(t._id).update(update)
    .then(function(){ toast('Status updated.'); loadTasks(); })
    .catch(function(e){ toast(e.message,'error'); loadTasks(); });
}

function deleteTask(t){
  if(!confirm('Delete task "'+(t.title||'')+'"?')) return;
  callApi({ action:'task.delete', taskId:t._id, title:t.title||'' })
    .then(function(){ toast('Task deleted.'); loadTasks(); }).catch(function(e){ toast(e.message,'error'); });
}

function loadBudget(){
  db.collection('ledger').where('projectId','==',current.id).get().then(function(snap){
    current.ledger = []; snap.forEach(function(doc){ var d=doc.data()||{}; d._id=doc.id; current.ledger.push(d); });
    renderBudget();
  }).catch(function(e){ var c=el('budget-card'); if(c) c.innerHTML='<p class="muted">Unable to load budget: '+esc(e.message)+'</p>'; });
}

function renderBudget(){
  var card = el('budget-card'); if(!card) return;
  var target = current.data.budgetTarget != null ? Number(current.data.budgetTarget) : null;
  var items = Array.isArray(current.budgetItems) ? current.budgetItems : [];
  var planned = items.reduce(function(sum,it){ return sum + (String(it.status||'planned')==='planned' ? (Number(it.amount)||0) : 0); }, 0);
  var spent = current.ledger.reduce(function(sum,e){ return sum + (String(e.direction)==='out' ? (Number(e.amount)||0) : 0); }, 0);
  var income = current.ledger.reduce(function(sum,e){ return sum + (String(e.direction)==='in' ? (Number(e.amount)||0) : 0); }, 0);
  var pct = target && target>0 ? Math.min(100, Math.round(spent/target*100)) : 0;
  var over = target != null && spent > target;

  var html = '<div class="stat">'+
    '<div class="s"><div class="v">'+money(planned)+'</div><div class="l">Planned (draft)</div></div>'+
    '<div class="s"><div class="v">'+money(spent)+'</div><div class="l">Committed</div></div>'+
    (target!=null?'<div class="s"><div class="v">'+money(target)+'</div><div class="l">Budget</div></div>':'')+
    (target!=null?'<div class="s"><div class="v" style="color:'+(over?'var(--danger)':'var(--iroko)')+'">'+money(target-spent)+'</div><div class="l">Remaining</div></div>':'')+
    (income>0?'<div class="s"><div class="v">'+money(income)+'</div><div class="l">Income tagged</div></div>':'')+
    '</div>';
  if(target!=null){ html += '<div class="budgetbar'+(over?' over':'')+'"><span style="width:'+pct+'%"></span></div>'; }

  html += '<h4 style="margin:16px 0 0;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)">Budget plan</h4>';
  if(!can('ledger.edit')){ html += '<p class="muted" style="font-size:12px;margin:4px 0 0">Plan draft lines here — finance or an admin commits them to the ledger.</p>'; }
  if(!items.length){ html += '<div class="empty" style="margin-top:8px">No budget lines yet.'+(can('projects.edit')?' Add lines to plan spend before it hits the ledger.':'')+'</div>'; }
  else {
    var rows = items.slice().sort(function(a,b){ return String(a.description||'').localeCompare(String(b.description||'')); }).map(function(it){
      var committed = String(it.status||'planned')==='committed';
      var actions;
      if(committed){ actions = '<span class="muted">✓ committed</span>'; }
      else {
        actions = (can('projects.edit')?'<button class="btn secondary xs" data-act="edit-bitem" data-bid="'+esc(it._id)+'">Edit</button> <button class="btn danger xs" data-act="del-bitem" data-bid="'+esc(it._id)+'">Delete</button> ':'')+
          (can('ledger.edit')?'<button class="btn xs" data-act="submit-bitem" data-bid="'+esc(it._id)+'">Submit</button>':'');
      }
      return '<tr class="'+(committed?'committed':'')+'"><td>'+esc(it.description||'—')+'</td><td>'+esc(it.category||'')+'</td><td class="num">'+money(it.amount)+'</td><td class="num">'+actions+'</td></tr>';
    }).join('');
    html += '<table class="bplan"><thead><tr><th>Description</th><th>Category</th><th class="num">Amount</th><th class="num"></th></tr></thead><tbody>'+rows+'</tbody></table>';
  }

  html += '<h4 style="margin:18px 0 0;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)">Tagged ledger entries</h4>';
  html += '<div class="rowlist" style="margin-top:8px">';
  if(!current.ledger.length){ html += '<div class="empty">No ledger entries tagged to this project yet.</div>'; }
  else {
    current.ledger.slice().sort(function(a,b){ return String(b.date||'').localeCompare(String(a.date||'')); }).forEach(function(e){
      html += '<div class="row"><span>'+(String(e.direction)==='out'?'🔴':'🟢')+' '+esc(e.description||'—')+'</span>'+
        '<span class="muted">'+esc(e.date||'')+'</span><span class="spacer"></span><strong>'+money(e.amount)+'</strong></div>';
    });
  }
  html += '</div>';
  card.innerHTML = html;
  card.onclick = function(ev){
    var t = ev.target; if(!t || !t.getAttribute) return;
    var act = t.getAttribute('data-act'); if(!act) return;
    var bid = t.getAttribute('data-bid');
    if(act==='edit-bitem') openBudgetItemModal(bid);
    else if(act==='del-bitem') deleteBudgetItem(bid);
    else if(act==='submit-bitem') submitBudgetItem(bid);
  };
}

    );

function saveProject(id){
  var name = el('pf-name').value.trim();
  var leadId = el('pf-lead').value;
  if(!name){ toast('Name is required.','error'); return; }
  if(!leadId){ toast('Select a lead.','error'); return; }
  var budgetRaw = el('pf-budget').value;
  var schoolIds = Array.prototype.slice.call(document.querySelectorAll('.pf-school-cb:checked')).map(function(cb){ return cb.value; });
  var payload = {
    action:'project.save', projectId:id||'', name:name,
    brief: el('pf-brief').value.trim(), status: el('pf-status').value,
    leadId: leadId, schoolIds: schoolIds,
    startDate: el('pf-start').value, dueDate: el('pf-due').value,
    budgetTarget: budgetRaw==='' ? null : Number(budgetRaw)
  };
  el('pf-save').disabled = true;
  callApi(payload).then(function(res){
    toast(id?'Project updated.':'Project created.');
    closeModal();
    if(id && current && current.id===id){ openProject(id); }
    loadProjects();
  }).catch(function(e){ toast(e.message,'error'); var b=el('pf-save'); if(b) b.disabled=false; });
}

function tsMs(v){ if(!v) return 0; try{ if(v.toDate) return v.toDate().getTime(); var d=new Date(v); return isNaN(d.getTime())?0:d.getTime(); }catch(e){ return 0; } }

// ========== DISCUSSION ==========
function loadComments(){
  db.collection('project_comments').where('projectId','==',current.id).get().then(function(snap){
    current.comments = []; snap.forEach(function(doc){ var d=doc.data()||{}; d._id=doc.id; current.comments.push(d); });
    renderComments();
  }).catch(function(e){ var c=el('discussion-card'); if(c) c.innerHTML='<p class="muted">Unable to load discussion: '+esc(e.message)+'</p>'; });
}
function renderComments(){
  var card = el('discussion-card'); if(!card) return;
  var msgs = current.comments.slice().sort(function(a,b){ return tsMs(a.createdAt) - tsMs(b.createdAt); });
  var html = '<div class="chat" id="chat-scroll">';
  if(!msgs.length){ html += '<div class="empty">No messages yet. Start the conversation.</div>'; }
  else {
    msgs.forEach(function(m){
      var canEdit = can('projects.edit') || (m.authorEmail && m.authorEmail===currentEmail);
      var histCount = Array.isArray(m.editHistory) ? m.editHistory.length : 0;
      html += '<div class="chat-msg"><div class="meta"><strong>'+esc(m.authorName||m.authorEmail||'Someone')+'</strong>'+
        '<span>'+esc(fmtWhen(m.createdAt))+'</span>'+
        (m.edited?'<span class="muted">· edited</span>':'')+
        '<span style="flex:1"></span>'+
        (histCount?'<button class="btn secondary xs" data-act="hist-comment" data-cid="'+esc(m._id)+'">history ('+histCount+')</button>':'')+
        (canEdit?'<button class="btn secondary xs" data-act="edit-comment" data-cid="'+esc(m._id)+'">Edit</button>':'')+
        '</div><div class="body">'+esc(m.body||'')+'</div></div>';
    });
  }
  html += '</div>';
  html += '<div class="composer"><textarea id="chat-input" maxlength="5000" placeholder="Write a message…"></textarea>'+
    '<button class="btn" onclick="postComment()">Send</button></div>';
  card.innerHTML = html;
  card.onclick = function(ev){
    var t = ev.target; if(!t || !t.getAttribute) return;
    var act = t.getAttribute('data-act'); if(!act) return;
    var cid = t.getAttribute('data-cid');
    if(act==='edit-comment') editComment(cid);
    else if(act==='hist-comment') showCommentHistory(cid);
  };
  var sc = el('chat-scroll'); if(sc){ sc.scrollTop = sc.scrollHeight; }
}
function postComment(){
  var input = el('chat-input'); if(!input) return;
  var body = input.value.trim();
  if(!body){ return; }
  input.disabled = true;
  db.collection('project_comments').add({
    projectId: current.id, body: body,
    authorEmail: currentEmail, authorName: currentEmail,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){ loadComments(); })
    .catch(function(e){ toast(e.message,'error'); var i=el('chat-input'); if(i) i.disabled=false; });
}
// Messages are never deleted — editing keeps the prior version in the message's history.
function editComment(commentId){
  var c = current.comments.filter(function(x){return x._id===commentId;})[0]; if(!c) return;
  openModal('<h3>Edit message</h3>'+
    '<div class="field"><textarea id="edit-body" maxlength="5000">'+esc(c.body||'')+'</textarea></div>'+
    '<p class="muted" style="font-size:12px;margin:0 0 12px">The previous version is kept in this message’s history — nothing is deleted.</p>'+
    '<div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" id="edit-save">Save</button></div>');
  el('edit-save').onclick = function(){ saveCommentEdit(commentId); };
}
function saveCommentEdit(commentId){
  var c = current.comments.filter(function(x){return x._id===commentId;})[0]; if(!c) return;
  var newBody = el('edit-body').value.trim();
  if(!newBody){ toast('Message cannot be empty.','error'); return; }
  if(newBody === (c.body||'')){ closeModal(); return; }
  var ref = db.collection('project_comments').doc(commentId);
  var btn = el('edit-save'); if(btn) btn.disabled = true;
  // Transaction so concurrent edits both append the true prior version — history is never lost.
  db.runTransaction(function(tx){
    return tx.get(ref).then(function(snap){
      if(!snap.exists){ throw new Error('This message no longer exists.'); }
      var d = snap.data() || {};
      if(newBody === (d.body||'')){ return; }
      var history = Array.isArray(d.editHistory) ? d.editHistory.slice() : [];
      history.push({ body: d.body||'', replacedAt: new Date().toISOString(), replacedBy: currentEmail });
      tx.update(ref, {
        body: newBody, editHistory: history, edited: true,
        lastEditedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    });
  }).then(function(){ toast('Message updated.'); closeModal(); loadComments(); })
    .catch(function(e){ toast(e.message,'error'); var b=el('edit-save'); if(b) b.disabled=false; });
}
function showCommentHistory(commentId){
  var c = current.comments.filter(function(x){return x._id===commentId;})[0]; if(!c) return;
  var hist = Array.isArray(c.editHistory) ? c.editHistory : [];
  var html = '<h3>Message history</h3><p class="muted" style="font-size:12px;margin:0 0 12px">Prior versions, kept for the record.</p>';
  if(!hist.length){ html += '<div class="empty">No prior versions.</div>'; }
  else { html += '<div class="chat">'+hist.slice().reverse().map(function(h){ return '<div class="chat-msg"><div class="meta"><span>'+esc(fmtWhen(h.replacedAt))+'</span>'+(h.replacedBy?'<span>'+esc(h.replacedBy)+'</span>':'')+'</div><div class="body">'+esc(h.body||'')+'</div></div>'; }).join('')+'</div>'; }
  html += '<div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Close</button></div>';
  openModal(html);
}

function saveBudgetItem(itemId){

  if(itemId){ p = db.collection('project_budget_items').doc(itemId).update(payload); }
  else {
    payload.projectId = current.id; payload.status = 'planned'; payload.ledgerId = '';
    payload.createdBy = currentEmail; payload.createdByName = currentEmail;
    payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
    p = db.collection('project_budget_items').add(payload);
  }
  p.then(function(){ toast(itemId?'Budget line updated.':'Budget line added.'); closeModal(); loadBudgetItems(); })
    .catch(function(e){ toast(e.message,'error'); var b=el('bi-save'); if(b) b.disabled=false; });
}
function deleteBudgetItem(itemId){
  var it = current.budgetItems.filter(function(x){return x._id===itemId;})[0] || {};
  if(String(it.status||'')==='committed'){ toast('Committed items are locked.','error'); return; }
  if(!confirm('Delete this budget line?')) return;
  db.collection('project_budget_items').doc(itemId).delete()
    .then(function(){ toast('Budget line deleted.'); loadBudgetItems(); }).catch(function(e){ toast(e.message,'error'); });
}
function submitBudgetItem(itemId){
  var it = current.budgetItems.filter(function(x){return x._id===itemId;})[0] || {};
  if(!confirm('Submit "'+(it.description||'this item')+'" ('+money(it.amount)+') to the ledger? It becomes a committed expense.')) return;
  callApi({ action:'budget.item.submit_to_ledger', itemId:itemId })
    .then(function(){ toast('Committed to ledger.'); loadBudgetItems(); loadBudget(); }).catch(function(e){ toast(e.message,'error'); });
}

// ========== EXTERNAL PEOPLE + INVITE ==========
function openExternalModal(){
  openModal('<h3>Add external person</h3>'+
    '<p class="muted" style="font-size:12.5px;margin:0 0 12px">Listed as a collaborator on this project. No login is created.</p>'+
    '<div class="field"><label>Name *</label><input id="ex-name" maxlength="200"></div>'+
    '<div class="field"><label>Email *</label><input id="ex-email" maxlength="320" placeholder="name@example.com"></div>'+
    '<div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button>'+
    '<button class="btn" onclick="addExternal()">Add</button></div>');
}
function addExternal(){
  var name = el('ex-name').value.trim();
  var email = el('ex-email').value.trim();
  if(!name){ toast('Name is required.','error'); return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ toast('Enter a valid email.','error'); return; }
  callApi({ action:'project.member.add_external', projectId:current.id, name:name, email:email })
    .then(function(){ toast('External person added.'); closeModal(); openProject(current.id); }).catch(function(e){ toast(e.message,'error'); });
}
function removeExternal(email, name){
  if(!confirm('Remove '+(name||email||'this person')+' from the project?')) return;
  callApi({ action:'project.member.remove_external', projectId:current.id, email:email })
    .then(function(){ toast('Removed.'); openProject(current.id); }).catch(function(e){ toast(e.message,'error'); });
}
function openInviteModal(){
  openModal('<h3>Invite by email</h3>'+
    '<p class="muted" style="font-size:12.5px;margin:0 0 12px">If the email is a known volunteer, they’re added as a member. Otherwise they’re listed as an external contact (no login).</p>'+
    '<div class="field"><label>Email *</label><input id="inv-email" maxlength="320" placeholder="name@example.com"></div>'+
    '<div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button>'+
    '<button class="btn" onclick="doInvite()">Invite</button></div>');
}
function doInvite(){
  var email = el('inv-email').value.trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ toast('Enter a valid email.','error'); return; }
  callApi({ action:'project.invite', projectId:current.id, email:email })
    .then(function(res){ toast(res && res.mode==='volunteer' ? 'Volunteer added.' : 'External contact invited.'); closeModal(); openProject(current.id); }).catch(function(e){ toast(e.message,'error'); });
}
</script>
