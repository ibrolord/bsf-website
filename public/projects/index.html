<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Projects — Big Sister Foundation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --iroko:#2D5E40; --iroko-dark:#1E3F2B; --brown:#3A2A1F; --terra:#C2734C;
    --gold:#D4A96A; --sage:#8BAF8E; --cream:#FFF8F0; --paper:#FAF7F2;
    --line:#E7E0D5; --muted:#6b5d50; --ok:#3f8f5f; --warn:#C2734C; --danger:#b5442f;
    --shadow:0 2px 10px rgba(30,63,43,.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--brown);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.5;}
  h1,h2,h3,h4{font-family:'EB Garamond',Georgia,serif;color:var(--iroko);margin:0;font-weight:600;}
  a{color:var(--terra);text-decoration:none;}
  button{font:inherit;cursor:pointer;border:none;border-radius:8px;}
  .btn{padding:8px 14px;border-radius:8px;font-size:14px;font-weight:600;background:var(--iroko);color:#fff;transition:.15s;}
  .btn:hover{background:var(--iroko-dark);}
  .btn.secondary{background:#fff;color:var(--iroko);border:1px solid var(--line);}
  .btn.secondary:hover{background:var(--cream);}
  .btn.danger{background:#fff;color:var(--danger);border:1px solid #eecdc6;}
  .btn.danger:hover{background:#fdf1ee;}
  .btn.xs{padding:4px 9px;font-size:12px;}
  .btn:disabled{opacity:.55;cursor:not-allowed;}

  header.topbar{background:var(--iroko);color:var(--cream);padding:14px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20;}
  header.topbar .mark{width:30px;height:34px;flex-shrink:0;}
  header.topbar .brand{font-family:'EB Garamond',Georgia,serif;font-size:19px;color:var(--cream);line-height:1;}
  header.topbar .brand small{display:block;font-family:system-ui,sans-serif;font-size:9.5px;letter-spacing:3px;color:var(--gold);margin-top:4px;}
  header.topbar .spacer{flex:1;}
  header.topbar .who{font-size:12.5px;color:rgba(255,255,255,.8);}
  header.topbar a.exit{color:var(--gold);font-size:13px;}

  .wrap{max-width:1120px;margin:0 auto;padding:26px 22px 80px;}
  .gate{max-width:420px;margin:12vh auto;text-align:center;color:var(--muted);}
  .hidden{display:none!important;}

  .page-head{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
  .page-head h1{font-size:30px;}
  .page-head .spacer{flex:1;}
  .crumb{background:none;color:var(--muted);font-size:13.5px;padding:6px 0;}
  .crumb:hover{color:var(--iroko);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);}
  .pcard{cursor:pointer;transition:.15s;}
  .pcard:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(30,63,43,.12);border-color:var(--sage);}
  .pcard h3{font-size:20px;margin-bottom:4px;}
  .pcard .meta{font-size:12.5px;color:var(--muted);margin-top:10px;display:flex;gap:14px;flex-wrap:wrap;}

  .chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:capitalize;}
  .chip.planning{background:#eef2ee;color:#4a6b54;}
  .chip.active{background:#e4f0e8;color:var(--ok);}
  .chip.paused{background:#faf0e4;color:var(--warn);}
  .chip.done{background:#eae4f0;color:#6b4f8f;}
  .chip.pri-urgent{background:#fbe6e0;color:var(--danger);}
  .chip.pri-high{background:#faf0e4;color:var(--warn);}
  .chip.pri-medium{background:#eef2ee;color:#4a6b54;}
  .chip.pri-low{background:#eef1f4;color:#5b6470;}

  .budgetbar{height:9px;border-radius:6px;background:#eee6da;overflow:hidden;margin-top:8px;}
  .budgetbar > span{display:block;height:100%;background:var(--iroko);}
  .budgetbar.over > span{background:var(--danger);}

  .detail-head{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px;}
  .detail-head h1{font-size:28px;}
  .detail-head .sub{color:var(--muted);font-size:13.5px;margin-top:8px;display:flex;gap:18px;flex-wrap:wrap;}
  .detail-head .brief{margin-top:14px;white-space:pre-wrap;line-height:1.65;}

  .section{margin-top:22px;}
  .section > h2{font-size:21px;margin-bottom:12px;display:flex;align-items:center;gap:10px;}
  .section > h2 .spacer{flex:1;}

  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .col{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;min-height:80px;}
  .col > h4{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:10px;font-family:system-ui,sans-serif;font-weight:700;}
  .task{background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:9px;}
  .task .t-title{font-weight:600;font-size:14px;margin-bottom:6px;}
  .task .t-meta{font-size:11.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .task select{font-size:11.5px;padding:2px 4px;border-radius:6px;border:1px solid var(--line);background:#fff;margin-top:7px;}
  .task .t-actions{margin-top:7px;display:flex;gap:6px;}

  .rowlist .row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .rowlist .row:last-child{border-bottom:none;}
  .rowlist .row .spacer{flex:1;}
  .muted{color:var(--muted);}
  .empty{color:var(--muted);font-size:13.5px;padding:14px;text-align:center;border:1px dashed var(--line);border-radius:10px;}

  .stat{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:10px;}
  .stat .s{}
  .stat .s .v{font-family:'EB Garamond',serif;font-size:26px;color:var(--iroko);font-weight:700;}
  .stat .s .l{font-size:12px;color:var(--muted);}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(30,63,43,.4);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .modal{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .modal h3{font-size:22px;margin-bottom:16px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--paper);}
  .field textarea{min-height:88px;resize:vertical;}
  .field.two{display:flex;gap:12px;}
  .field.two > div{flex:1;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

  /* toast */
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--brown);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;z-index:100;opacity:0;transition:.25s;pointer-events:none;}
  #toast.show{opacity:1;}
  #toast.error{background:var(--danger);}

  @media(max-width:820px){ .board{grid-template-columns:1fr 1fr;} }
  @media(max-width:520px){ .board{grid-template-columns:1fr;} }
</style>
</head>
<body>

<header class="topbar">
  <svg class="mark" viewBox="0 0 34 40" aria-hidden="true">
    <ellipse cx="17" cy="13" rx="14" ry="11" fill="#8BAF8E"/>
    <ellipse cx="11" cy="11" rx="9" ry="8" fill="#FFF8F0" opacity="0.92"/>
    <ellipse cx="21" cy="14" rx="9" ry="8" fill="#E8EFE6" opacity="0.85"/>
    <rect x="15.5" y="20" width="3" height="16" fill="#3A2A1F"/>
  </svg>
  <div class="brand">Projects<small>PLANNING &amp; DELIVERY</small></div>
  <div class="spacer"></div>
  <span class="who" id="who"></span>
  <a class="exit" href="/volunteer/dashboard/">← Dashboard</a>
</header>

<div id="gate" class="gate">Loading…</div>

<main id="app" class="wrap hidden">

  <!-- LIST VIEW -->
  <section id="view-list">
    <div class="page-head">
      <h1>Projects</h1>
      <div class="spacer"></div>
      <button class="btn lead-only hidden" id="btn-new-project" onclick="openProjectModal(null)">+ New Project</button>
    </div>
    <div id="projects-grid" class="grid"></div>
  </section>

  <!-- DETAIL VIEW -->
  <section id="view-detail" class="hidden">
    <button class="crumb" onclick="showList()">← All projects</button>
    <div id="detail-body"></div>
  </section>

</main>

<div id="modal-root"></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ========== FIREBASE INIT ==========
var firebaseConfig = {
  apiKey: "AIzaSyCwos6XR9-uqAf_Esmh2K_hJoLxq4gnEuU",
  authDomain: "big-sister-foundation.firebaseapp.com",
  projectId: "big-sister-foundation",
  storageBucket: "big-sister-foundation.firebasestorage.app",
  messagingSenderId: "778723584560",
  appId: "1:778723584560:web:7499944c30001e7fcf5bf5",
  measurementId: "G-Q4EYY24EDZ"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();
var db = firebase.firestore();

// ========== STATE ==========
var SUPER_EMAILS = ['admin@bigsisterfoundation.org','bsfadmin@bigsisterfoundation.org','princebolajibreeze@gmail.com','bolajiagunbiade1@gmail.com'];
var STATUS_ORDER = ['open','in_progress','completed','blocked'];
var STATUS_LABEL = { open:'Open', in_progress:'In progress', completed:'Completed', blocked:'Blocked' };
var currentUser = null, currentEmail = '', userRoles = [], userPerms = [], userOverrides = {};
var projectsCache = [];
var volunteersCache = null, schoolsCache = null;
var current = null; // { id, data, tasks, ledger, events }

// Client mirror of auth.js ROLE_PERMISSIONS for the keys this page gates on.
// The server (mutate.js) is the real enforcer; this only hides buttons that would 403.
var ROLE_PERMS = {
  admin:        ['projects.create','projects.edit','projects.delete','projects.manage_members','tasks.assign','events.edit','ledger.edit'],
  superadmin:   ['projects.create','projects.edit','projects.delete','projects.manage_members','tasks.assign','events.edit','ledger.edit'],
  program_lead: ['projects.create','projects.edit','projects.delete','projects.manage_members','tasks.assign','events.edit'],
  team_lead:    ['projects.create','projects.edit','projects.manage_members','tasks.assign'],
  finance:      ['ledger.edit']
};
function can(perm){
  if(SUPER_EMAILS.indexOf(currentEmail) > -1) return true;
  // explicit per-user override wins over role/stored grants (mirrors auth.js resolveAllowedPermission)
  if(userOverrides && (perm in userOverrides)) return userOverrides[perm] === true;
  if(userPerms.indexOf(perm) > -1) return true;
  return userRoles.some(function(r){ return (ROLE_PERMS[r]||[]).indexOf(perm) > -1; });
}

// ========== HELPERS ==========
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function money(n){ var v = Number(n)||0; return '₦' + v.toLocaleString('en-NG'); }
function fmtDate(v){ if(!v) return '—'; try{ var d = v && v.toDate ? v.toDate() : new Date(v); if(isNaN(d.getTime())) return String(v); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }catch(e){ return String(v); } }
function toast(msg, type){ var t=document.getElementById('toast'); t.textContent=msg; t.className='show'+(type==='error'?' error':''); setTimeout(function(){ t.className=''; }, 3200); }
function el(id){ return document.getElementById(id); }

async function callApi(payload){
  if(!currentUser){ throw new Error('Not signed in.'); }
  var token = await currentUser.getIdToken();
  var res = await fetch('/api/admin/mutate', { method:'POST', headers:{ 'Authorization':'Bearer '+token, 'Content-Type':'application/json' }, body: JSON.stringify(payload||{}) });
  var data = null; try{ data = await res.json(); }catch(_e){}
  if(!res.ok){ var msg = data && data.error && data.error.message ? data.error.message : 'Request failed ('+res.status+')'; throw new Error(msg); }
  return data || { ok:true };
}

function closeModal(){ el('modal-root').innerHTML=''; }
function openModal(html){ el('modal-root').innerHTML = '<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">'+html+'</div></div>'; }

// ========== AUTH ==========
auth.onAuthStateChanged(function(user){
  if(!user){ window.location.href = '/signin/'; return; }
  currentUser = user;
  currentEmail = (user.email||'').toLowerCase();
  db.collection('users').doc(currentEmail).get().then(function(doc){
    var d = doc.exists ? (doc.data()||{}) : {};
    userRoles = Array.isArray(d.roles) ? d.roles : (d.role ? [d.role] : []);
    userPerms = Array.isArray(d.permissions) ? d.permissions : [];
    userOverrides = (d.permission_overrides || d.permissionOverrides || {});
    el('who').textContent = currentEmail;
    el('gate').classList.add('hidden');
    el('app').classList.remove('hidden');
    document.querySelectorAll('.lead-only').forEach(function(n){ n.classList.toggle('hidden', !can('projects.create')); });
    loadProjects();
  }).catch(function(e){
    el('gate').textContent = 'Could not load your account: ' + e.message;
  });
});

// ========== LIST ==========
function loadProjects(){
  var grid = el('projects-grid');
  grid.innerHTML = '<p class="muted">Loading projects…</p>';
  db.collection('projects').orderBy('createdAt','desc').get().then(function(snap){
    projectsCache = [];
    snap.forEach(function(doc){ var d = doc.data()||{}; d._id = doc.id; projectsCache.push(d); });
    renderProjects();
  }).catch(function(e){
    grid.innerHTML = '<p class="muted">Unable to load projects: '+esc(e.message)+'</p>';
  });
}

function renderProjects(){
  var grid = el('projects-grid');
  if(!projectsCache.length){
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1">No projects yet.'+(can('projects.create')?' Click “New Project” to create one.':'')+'</div>';
    return;
  }
  grid.innerHTML = '';
  projectsCache.forEach(function(p){
    var members = Array.isArray(p.members) ? p.members.length : 0;
    var card = document.createElement('div');
    card.className = 'card pcard';
    card.onclick = function(){ openProject(p._id); };
    card.innerHTML =
      '<div style="display:flex;align-items:flex-start;gap:8px"><h3 style="flex:1">'+esc(p.name)+'</h3>'+
      '<span class="chip '+esc(p.status||'planning')+'">'+esc(p.status||'planning')+'</span></div>'+
      (p.brief ? '<p class="muted" style="font-size:13px;margin:6px 0 0">'+esc(String(p.brief).slice(0,120))+(String(p.brief).length>120?'…':'')+'</p>' : '')+
      '<div class="meta">'+
        '<span>👤 '+esc(p.leadName||'No lead')+'</span>'+
        '<span>👥 '+members+' member'+(members===1?'':'s')+'</span>'+
        (p.dueDate ? '<span>📅 due '+esc(fmtDate(p.dueDate))+'</span>' : '')+
        (p.budgetTarget!=null ? '<span>💰 '+esc(money(p.budgetTarget))+'</span>' : '')+
        (p.schoolName ? '<span>🏫 '+esc(p.schoolName)+'</span>' : '')+
      '</div>';
    grid.appendChild(card);
  });
}

function showList(){ el('view-detail').classList.add('hidden'); el('view-list').classList.remove('hidden'); current=null; }

// ========== DETAIL ==========
function openProject(id){
  el('view-list').classList.add('hidden');
  el('view-detail').classList.remove('hidden');
  el('detail-body').innerHTML = '<p class="muted">Loading…</p>';
  db.collection('projects').doc(id).get().then(function(doc){
    if(!doc.exists){ el('detail-body').innerHTML = '<div class="empty">Project not found.</div>'; return; }
    current = { id:id, data:(doc.data()||{}), tasks:[], ledger:[], events:[] };
    renderDetail();
    loadTasks();
    loadBudget();
    loadLinkedEvents();
  }).catch(function(e){ el('detail-body').innerHTML = '<div class="empty">'+esc(e.message)+'</div>'; });
}

function renderDetail(){
  var p = current.data;
  var members = Array.isArray(p.members) ? p.members : [];
  var leadBtns = (can('projects.edit') ? '<button class="btn secondary xs" onclick="openProjectModal(current.id)">Edit</button> ' : '')
    + (can('projects.delete') ? '<button class="btn danger xs" onclick="deleteProject()">Delete</button>' : '');
  var html =
    '<div class="detail-head">'+
      '<div style="display:flex;align-items:flex-start;gap:12px">'+
        '<h1 style="flex:1">'+esc(p.name)+'</h1>'+
        '<span class="chip '+esc(p.status||'planning')+'">'+esc(p.status||'planning')+'</span>'+
      '</div>'+
      '<div class="sub">'+
        '<span>Lead: <strong>'+esc(p.leadName||'—')+'</strong></span>'+
        (p.startDate?'<span>Start: '+esc(fmtDate(p.startDate))+'</span>':'')+
        (p.dueDate?'<span>Due: '+esc(fmtDate(p.dueDate))+'</span>':'')+
        (p.schoolName?'<span>🏫 School: <strong>'+esc(p.schoolName)+'</strong></span>':'')+
      '</div>'+
      (p.brief?'<div class="brief">'+esc(p.brief)+'</div>':'')+
      (leadBtns?'<div style="margin-top:14px">'+leadBtns+'</div>':'')+
    '</div>'+

    // MEMBERS
    '<div class="section"><h2>Members <span class="spacer"></span>'+
      (can('projects.manage_members')?'<button class="btn secondary xs" onclick="openMemberPicker()">+ Add member</button>':'')+'</h2>'+
      '<div class="card"><div class="rowlist" id="members-list"></div></div></div>'+

    // TASKS
    '<div class="section"><h2>Tasks <span class="spacer"></span>'+
      (can('tasks.assign')?'<button class="btn secondary xs" onclick="openTaskModal(null)">+ Assign task</button>':'')+'</h2>'+
      '<div class="board" id="task-board"><p class="muted">Loading tasks…</p></div></div>'+

    // BUDGET
    '<div class="section"><h2>Budget <span class="spacer"></span>'+
      (can('ledger.edit')?'<button class="btn secondary xs" onclick="openLedgerPicker()">+ Tag ledger entry</button>':'')+'</h2>'+
      '<div class="card" id="budget-card"><p class="muted">Loading budget…</p></div></div>'+

    // EVENTS
    '<div class="section"><h2>Events <span class="spacer"></span>'+
      (can('events.edit')?'<button class="btn secondary xs" onclick="openEventPicker()">+ Link event</button>':'')+'</h2>'+
      '<div class="card"><div class="rowlist" id="events-list"><p class="muted">Loading events…</p></div></div></div>';

  el('detail-body').innerHTML = html;
  renderMembers();
}

function renderMembers(){
  var list = el('members-list'); if(!list) return;
  var members = Array.isArray(current.data.members) ? current.data.members : [];
  if(!members.length){ list.innerHTML = '<div class="empty">No members yet.</div>'; return; }
  list.innerHTML = '';
  members.forEach(function(m){
    var row = document.createElement('div'); row.className='row';
    row.innerHTML = '<span><strong>'+esc(m.name||'—')+'</strong></span><span class="muted">'+esc(m.email||'')+'</span><span class="spacer"></span>';
    if(can('projects.manage_members')){
      var b = document.createElement('button'); b.className='btn danger xs'; b.textContent='Remove';
      b.onclick = function(){ removeMember(m.id, m.name); };
      row.appendChild(b);
    }
    list.appendChild(row);
  });
}

// ========== TASKS ==========
function loadTasks(){
  db.collection('tasks').where('projectId','==',current.id).get().then(function(snap){
    current.tasks = []; snap.forEach(function(doc){ var d=doc.data()||{}; d._id=doc.id; current.tasks.push(d); });
    renderTasks();
  }).catch(function(e){ var b=el('task-board'); if(b) b.innerHTML='<p class="muted">Unable to load tasks: '+esc(e.message)+'</p>'; });
}

function renderTasks(){
  var board = el('task-board'); if(!board) return;
  board.innerHTML = '';
  STATUS_ORDER.forEach(function(st){
    var col = document.createElement('div'); col.className='col';
    var items = current.tasks.filter(function(t){ return (t.status||'open')===st; });
    col.innerHTML = '<h4>'+STATUS_LABEL[st]+' ('+items.length+')</h4>';
    items.forEach(function(t){ col.appendChild(taskCard(t)); });
    board.appendChild(col);
  });
}

function taskCard(t){
  var d = document.createElement('div'); d.className='task';
  var canStatus = can('tasks.assign') || (t.assigneeEmail && t.assigneeEmail === currentEmail);
  var html = '<div class="t-title">'+esc(t.title||'Untitled')+'</div>'+
    '<div class="t-meta"><span class="chip pri-'+esc(t.priority||'medium')+'">'+esc(t.priority||'medium')+'</span>'+
    (t.assigneeName?'<span>👤 '+esc(t.assigneeName)+'</span>':'<span class="muted">Unassigned</span>')+
    (t.dueDate?'<span>📅 '+esc(fmtDate(t.dueDate))+'</span>':'')+'</div>';
  d.innerHTML = html;
  if(canStatus){
    var sel = document.createElement('select');
    STATUS_ORDER.forEach(function(st){ var o=document.createElement('option'); o.value=st; o.textContent=STATUS_LABEL[st]; if((t.status||'open')===st)o.selected=true; sel.appendChild(o); });
    sel.onchange = function(){ updateTaskStatus(t, sel.value); };
    d.appendChild(sel);
  }
  if(can('tasks.assign')){
    var actions = document.createElement('div'); actions.className='t-actions';
    var be=document.createElement('button'); be.className='btn secondary xs'; be.textContent='Edit'; be.onclick=function(){ openTaskModal(t); };
    var bd=document.createElement('button'); bd.className='btn danger xs'; bd.textContent='Delete'; bd.onclick=function(){ deleteTask(t); };
    actions.appendChild(be); actions.appendChild(bd); d.appendChild(actions);
  }
  return d;
}

// Self / assignee status change stays client-side (preserves existing task flow);
// leads route through the audited API so delegation changes are logged.
function updateTaskStatus(t, status){
  if(can('tasks.assign')){
    callApi({ action:'task.save', taskId:t._id, projectId:current.id, title:t.title, description:t.description||'', status:status, priority:t.priority||'medium', assigneeId:t.assigneeId||'', dueDate:t.dueDate||'' })
      .then(function(){ toast('Task updated.'); loadTasks(); }).catch(function(e){ toast(e.message,'error'); loadTasks(); });
    return;
  }
  var update = {
    status: status,
    completedAt: status==='completed' ? firebase.firestore.FieldValue.serverTimestamp() : null,
    lastEditedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  db.collection('tasks').doc(t._id).update(update)
    .then(function(){ toast('Status updated.'); loadTasks(); })
    .catch(function(e){ toast(e.message,'error'); loadTasks(); });
}

function deleteTask(t){
  if(!confirm('Delete task "'+(t.title||'')+'"?')) return;
  callApi({ action:'task.delete', taskId:t._id, title:t.title||'' })
    .then(function(){ toast('Task deleted.'); loadTasks(); }).catch(function(e){ toast(e.message,'error'); });
}

// ========== BUDGET ==========
function loadBudget(){
  db.collection('ledger').where('projectId','==',current.id).get().then(function(snap){
    current.ledger = []; snap.forEach(function(doc){ var d=doc.data()||{}; d._id=doc.id; current.ledger.push(d); });
    renderBudget();
  }).catch(function(e){ var c=el('budget-card'); if(c) c.innerHTML='<p class="muted">Unable to load budget: '+esc(e.message)+'</p>'; });
}

function renderBudget(){
  var card = el('budget-card'); if(!card) return;
  var target = current.data.budgetTarget != null ? Number(current.data.budgetTarget) : null;
  var spent = current.ledger.reduce(function(sum,e){ return sum + (String(e.direction)==='out' ? (Number(e.amount)||0) : 0); }, 0);
  var income = current.ledger.reduce(function(sum,e){ return sum + (String(e.direction)==='in' ? (Number(e.amount)||0) : 0); }, 0);
  var pct = target && target>0 ? Math.min(100, Math.round(spent/target*100)) : 0;
  var over = target != null && spent > target;
  var html = '<div class="stat">'+
    '<div class="s"><div class="v">'+money(spent)+'</div><div class="l">Spent</div></div>'+
    (target!=null?'<div class="s"><div class="v">'+money(target)+'</div><div class="l">Budget</div></div>':'')+
    (target!=null?'<div class="s"><div class="v" style="color:'+(over?'var(--danger)':'var(--iroko)')+'">'+money(target-spent)+'</div><div class="l">Remaining</div></div>':'')+
    (income>0?'<div class="s"><div class="v">'+money(income)+'</div><div class="l">Income tagged</div></div>':'')+
    '</div>';
  if(target!=null){ html += '<div class="budgetbar'+(over?' over':'')+'"><span style="width:'+pct+'%"></span></div>'; }
  html += '<div class="rowlist" style="margin-top:14px">';
  if(!current.ledger.length){ html += '<div class="empty">No ledger entries tagged to this project yet.</div>'; }
  else {
    current.ledger.sort(function(a,b){ return String(b.date||'').localeCompare(String(a.date||'')); }).forEach(function(e){
      html += '<div class="row"><span>'+(String(e.direction)==='out'?'🔴':'🟢')+' '+esc(e.description||'—')+'</span>'+
        '<span class="muted">'+esc(e.date||'')+'</span><span class="spacer"></span><strong>'+money(e.amount)+'</strong></div>';
    });
  }
  html += '</div>';
  card.innerHTML = html;
}

// ========== EVENTS ==========
function loadLinkedEvents(){
  db.collection('events').where('projectId','==',current.id).get().then(function(snap){
    current.events = []; snap.forEach(function(doc){ var d=doc.data()||{}; d._id=doc.id; current.events.push(d); });
    renderLinkedEvents();
  }).catch(function(e){ var l=el('events-list'); if(l) l.innerHTML='<p class="muted">Unable to load events: '+esc(e.message)+'</p>'; });
}

function renderLinkedEvents(){
  var list = el('events-list'); if(!list) return;
  if(!current.events.length){ list.innerHTML = '<div class="empty">No events linked to this project.</div>'; return; }
  list.innerHTML = '';
  current.events.forEach(function(ev){
    var row = document.createElement('div'); row.className='row';
    row.innerHTML = '<span><strong>'+esc(ev.title||'—')+'</strong></span>'+
      '<span class="muted">'+esc(fmtDate(ev.date))+'</span>'+
      (ev.status?'<span class="chip planning">'+esc(ev.status)+'</span>':'')+'<span class="spacer"></span>';
    if(can('events.edit')){
      var b=document.createElement('button'); b.className='btn danger xs'; b.textContent='Unlink';
      b.onclick=function(){ linkEvent(ev._id, ''); };
      row.appendChild(b);
    }
    list.appendChild(row);
  });
}

// ========== LEAD ACTIONS: PROJECT CRUD ==========
function ensureVolunteers(){
  if(volunteersCache) return Promise.resolve(volunteersCache);
  return db.collection('volunteers').get().then(function(snap){
    volunteersCache = []; snap.forEach(function(doc){ var d=doc.data()||{}; d._id=doc.id; volunteersCache.push(d); });
    volunteersCache.sort(function(a,b){ return String(a.name||'').localeCompare(String(b.name||'')); });
    return volunteersCache;
  });
}
function ensureSchools(){
  if(schoolsCache) return Promise.resolve(schoolsCache);
  return db.collection('schools').get().then(function(snap){
    schoolsCache = []; snap.forEach(function(doc){ var d=doc.data()||{}; d._id=doc.id; schoolsCache.push(d); });
    schoolsCache.sort(function(a,b){ return String(a.name||'').localeCompare(String(b.name||'')); });
    return schoolsCache;
  });
}

function openProjectModal(id){
  var p = id ? (projectsCache.filter(function(x){return x._id===id;})[0] || (current&&current.id===id?current.data:{})) : {};
  Promise.all([ensureVolunteers(), ensureSchools()]).then(function(){
    var volOpts = volunteersCache.map(function(v){ return '<option value="'+esc(v._id)+'"'+(p.leadId===v._id?' selected':'')+'>'+esc(v.name||v.email||v._id)+'</option>'; }).join('');
    var schoolOpts = '<option value="">— none —</option>' + schoolsCache.map(function(s){ return '<option value="'+esc(s._id)+'"'+(p.schoolId===s._id?' selected':'')+'>'+esc(s.name)+'</option>'; }).join('');
    var statusOpts = ['planning','active','paused','done'].map(function(s){ return '<option value="'+s+'"'+((p.status||'planning')===s?' selected':'')+'>'+s+'</option>'; }).join('');
    openModal(
      '<h3>'+(id?'Edit project':'New project')+'</h3>'+
      '<div class="field"><label>Name *</label><input id="pf-name" maxlength="200" value="'+esc(p.name||'')+'"></div>'+
      '<div class="field"><label>Brief</label><textarea id="pf-brief" maxlength="10000">'+esc(p.brief||'')+'</textarea></div>'+
      '<div class="field two"><div><label>Status</label><select id="pf-status">'+statusOpts+'</select></div>'+
        '<div><label>Lead *</label><select id="pf-lead">'+volOpts+'</select></div></div>'+
      '<div class="field two"><div><label>Start date</label><input id="pf-start" type="date" value="'+esc(p.startDate||'')+'"></div>'+
        '<div><label>Due date</label><input id="pf-due" type="date" value="'+esc(p.dueDate||'')+'"></div></div>'+
      '<div class="field two"><div><label>Partner school</label><select id="pf-school">'+schoolOpts+'</select></div>'+
        '<div><label>Budget target (₦)</label><input id="pf-budget" type="number" min="0" value="'+(p.budgetTarget!=null?esc(p.budgetTarget):'')+'"></div></div>'+
      '<div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button>'+
        '<button class="btn" id="pf-save">Save</button></div>'
    );
    el('pf-save').onclick = function(){ saveProject(id||''); };
  }).catch(function(e){ toast(e.message,'error'); });
}

function saveProject(id){
  var name = el('pf-name').value.trim();
  var leadId = el('pf-lead').value;
  if(!name){ toast('Name is required.','error'); return; }
  if(!leadId){ toast('Select a lead.','error'); return; }
  var budgetRaw = el('pf-budget').value;
  var payload = {
    action:'project.save', projectId:id||'', name:name,
    brief: el('pf-brief').value.trim(), status: el('pf-status').value,
    leadId: leadId, schoolId: el('pf-school').value,
    startDate: el('pf-start').value, dueDate: el('pf-due').value,
    budgetTarget: budgetRaw==='' ? null : Number(budgetRaw)
  };
  el('pf-save').disabled = true;
  callApi(payload).then(function(res){
    toast(id?'Project updated.':'Project created.');
    closeModal();
    if(id && current && current.id===id){ openProject(id); }
    loadProjects();
  }).catch(function(e){ toast(e.message,'error'); var b=el('pf-save'); if(b) b.disabled=false; });
}

function deleteProject(){
  if(!current) return;
  if(!confirm('Delete project "'+(current.data.name||'')+'"? Tasks will be unlinked (not deleted).')) return;
  callApi({ action:'project.delete', projectId:current.id, name:current.data.name||'' })
    .then(function(){ toast('Project deleted.'); showList(); loadProjects(); }).catch(function(e){ toast(e.message,'error'); });
}

// ========== LEAD ACTIONS: MEMBERS ==========
function openMemberPicker(){
  ensureVolunteers().then(function(){
    var existing = (current.data.members||[]).map(function(m){ return m.id; });
    var opts = volunteersCache.filter(function(v){ return existing.indexOf(v._id)===-1; })
      .map(function(v){ return '<option value="'+esc(v._id)+'">'+esc(v.name||v.email||v._id)+'</option>'; }).join('');
    if(!opts){ toast('All volunteers are already members.','error'); return; }
    openModal('<h3>Add member</h3><div class="field"><label>Volunteer</label><select id="mem-sel">'+opts+'</select></div>'+
      '<div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button>'+
      '<button class="btn" onclick="addMember()">Add</button></div>');
  }).catch(function(e){ toast(e.message,'error'); });
}
function addMember(){
  var vid = el('mem-sel').value;
  callApi({ action:'project.member.add', projectId:current.id, volunteerId:vid }).then(function(res){
    if(res.member){ current.data.members = (current.data.members||[]).concat([res.member]); }
    toast('Member added.'); closeModal(); openProject(current.id);
  }).catch(function(e){ toast(e.message,'error'); });
}
function removeMember(vid, name){
  if(!confirm('Remove '+(name||'this member')+' from the project?')) return;
  callApi({ action:'project.member.remove', projectId:current.id, volunteerId:vid })
    .then(function(){ toast('Member removed.'); openProject(current.id); }).catch(function(e){ toast(e.message,'error'); });
}

// ========== LEAD ACTIONS: TASKS ==========
function openTaskModal(t){
  ensureVolunteers().then(function(){
    t = t || {};
    var pool = (current.data.members||[]);
    // allow assigning to project members; fall back to all volunteers if no members yet
    var source = pool.length ? pool.map(function(m){ return { _id:m.id, name:m.name, email:m.email }; }) : (volunteersCache || []);
    // keep the current assignee selectable even if they are no longer in the member pool (else editing silently unassigns them)
    if(t.assigneeId && !source.some(function(v){ return v._id === t.assigneeId; })){
      source = source.concat([{ _id:t.assigneeId, name:(t.assigneeName||t.assigneeEmail||t.assigneeId), email:t.assigneeEmail||'' }]);
    }
    var assigneeOpts = '<option value="">— unassigned —</option>' + source.map(function(v){ return '<option value="'+esc(v._id)+'"'+(t.assigneeId===v._id?' selected':'')+'>'+esc(v.name||v.email||v._id)+'</option>'; }).join('');
    var statusOpts = STATUS_ORDER.map(function(s){ return '<option value="'+s+'"'+((t.status||'open')===s?' selected':'')+'>'+STATUS_LABEL[s]+'</option>'; }).join('');
    var priOpts = ['urgent','high','medium','low'].map(function(s){ return '<option value="'+s+'"'+((t.priority||'medium')===s?' selected':'')+'>'+s+'</option>'; }).join('');
    openModal('<h3>'+(t._id?'Edit task':'Assign task')+'</h3>'+
      '<div class="field"><label>Title *</label><input id="tf-title" maxlength="200" value="'+esc(t.title||'')+'"></div>'+
      '<div class="field"><label>Description</label><textarea id="tf-desc" maxlength="10000">'+esc(t.description||'')+'</textarea></div>'+
      '<div class="field two"><div><label>Assignee</label><select id="tf-assignee">'+assigneeOpts+'</select></div>'+
        '<div><label>Due date</label><input id="tf-due" type="date" value="'+esc(t.dueDate||'')+'"></div></div>'+
      '<div class="field two"><div><label>Status</label><select id="tf-status">'+statusOpts+'</select></div>'+
        '<div><label>Priority</label><select id="tf-pri">'+priOpts+'</select></div></div>'+
      '<div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button>'+
        '<button class="btn" id="tf-save">Save</button></div>');
    el('tf-save').onclick = function(){ saveTask(t._id||''); };
  }).catch(function(e){ toast(e.message,'error'); });
}
function saveTask(id){
  var title = el('tf-title').value.trim();
  if(!title){ toast('Title is required.','error'); return; }
  var payload = { action:'task.save', taskId:id||'', projectId:current.id, title:title,
    description: el('tf-desc').value.trim(), status: el('tf-status').value, priority: el('tf-pri').value,
    assigneeId: el('tf-assignee').value, dueDate: el('tf-due').value };
  el('tf-save').disabled = true;
  callApi(payload).then(function(){ toast(id?'Task updated.':'Task assigned.'); closeModal(); loadTasks(); })
    .catch(function(e){ toast(e.message,'error'); var b=el('tf-save'); if(b) b.disabled=false; });
}

// ========== LEAD ACTIONS: LINK EVENT / TAG LEDGER ==========
function openEventPicker(){
  db.collection('events').get().then(function(snap){
    var opts = '';
    snap.forEach(function(doc){ var d=doc.data()||{}; if(d.projectId && d.projectId!==current.id) return; opts += '<option value="'+esc(doc.id)+'">'+esc(d.title||doc.id)+' — '+esc(fmtDate(d.date))+'</option>'; });
    if(!opts){ toast('No available events to link.','error'); return; }
    openModal('<h3>Link an event</h3><div class="field"><label>Event</label><select id="ev-sel">'+opts+'</select></div>'+
      '<div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button>'+
      '<button class="btn" onclick="linkEventFromPicker()">Link</button></div>');
  }).catch(function(e){ toast(e.message,'error'); });
}
function linkEventFromPicker(){ var id = el('ev-sel').value; closeModal(); linkEvent(id, current.id); }
function linkEvent(eventId, projectId){
  callApi({ action:'event.link_project', eventId:eventId, projectId:projectId })
    .then(function(){ toast(projectId?'Event linked.':'Event unlinked.'); loadLinkedEvents(); }).catch(function(e){ toast(e.message,'error'); });
}

function openLedgerPicker(){
  db.collection('ledger').orderBy('date','desc').limit(100).get().then(function(snap){
    var opts = '';
    snap.forEach(function(doc){ var d=doc.data()||{}; if(d.projectId && d.projectId!==current.id) return; opts += '<option value="'+esc(doc.id)+'">'+esc(d.date||'')+' · '+(String(d.direction)==='out'?'−':'+')+money(d.amount)+' · '+esc((d.description||'').slice(0,40))+'</option>'; });
    if(!opts){ toast('No available ledger entries to tag.','error'); return; }
    openModal('<h3>Tag a ledger entry</h3><p class="muted" style="font-size:12.5px;margin:0 0 12px">Tagging pulls the entry into this project’s budget. It stays in the main ledger.</p>'+
      '<div class="field"><label>Entry</label><select id="lg-sel">'+opts+'</select></div>'+
      '<div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button>'+
      '<button class="btn" onclick="tagLedgerFromPicker()">Tag</button></div>');
  }).catch(function(e){ toast(e.message,'error'); });
}
function tagLedgerFromPicker(){ var id = el('lg-sel').value; closeModal(); callApi({ action:'ledger.tag_project', ledgerId:id, projectId:current.id }).then(function(){ toast('Entry tagged.'); loadBudget(); }).catch(function(e){ toast(e.message,'error'); }); }
</script>
