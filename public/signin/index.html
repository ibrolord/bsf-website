<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Big Sister Foundation</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 130'%3E%3Cellipse cx='50' cy='35' rx='35' ry='30' fill='%232D5E40' opacity='0.85'/%3E%3Cellipse cx='30' cy='45' rx='28' ry='24' fill='%232D5E40' opacity='0.7'/%3E%3Cellipse cx='70' cy='45' rx='28' ry='24' fill='%232D5E40' opacity='0.7'/%3E%3Cpath d='M47 70 Q46 90 44 110 Q50 112 56 110 Q54 90 53 70 Z' fill='%233A2A1F' opacity='0.8'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #2D5E40;
      --green-dark: #1E3F2B;
      --brown: #3A2A1F;
      --terra: #C2734C;
      --gold: #D4A96A;
      --sage: #8BAF8E;
      --cream: #FFF8F0;
      --font-serif: 'EB Garamond', Georgia, 'Times New Roman', serif;
      --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-sans);
      font-size: 0.95rem;
      line-height: 1.65;
      color: var(--brown);
      background: var(--green-dark);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; border: none; background: none; }

    /* ── Card ── */
    .card {
      background: var(--cream);
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,0.35);
    }

    .card-header {
      background: var(--green);
      padding: 2.25rem 2.5rem 2rem;
      text-align: center;
      position: relative;
    }

    .logo-link {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1.25rem;
      color: #fff;
      opacity: 0.85;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .logo-link svg { width: 28px; height: 28px; }
    .logo-link:hover { opacity: 1; }

    .card-header h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 4vw, 1.9rem);
      font-weight: 500;
      color: #fff;
      line-height: 1.2;
    }
    .card-header p {
      margin-top: 0.4rem;
      color: rgba(255,255,255,0.72);
      font-size: 0.88rem;
    }

    /* ── Body ── */
    .card-body {
      padding: 2rem 2.5rem 2.5rem;
    }

    /* ── Form ── */
    .field { margin-bottom: 1.1rem; }
    .field label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--green-dark);
      margin-bottom: 0.4rem;
    }
    .field input {
      width: 100%;
      padding: 0.72rem 1rem;
      border: 1.5px solid #d1c8bc;
      border-radius: 10px;
      font: inherit;
      font-size: 0.95rem;
      color: var(--brown);
      background: #fff;
      outline: none;
      transition: border-color 0.18s;
    }
    .field input:focus { border-color: var(--green); }
    .field input::placeholder { color: #b0a898; }

    /* password wrapper */
    .pw-wrap { position: relative; }
    .pw-toggle {
      position: absolute;
      right: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      color: #9c9185;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
    }
    .pw-toggle:hover { color: var(--green); }

    /* ── Error / info message ── */
    .msg {
      display: none;
      font-size: 0.86rem;
      border-radius: 8px;
      padding: 0.6rem 0.9rem;
      margin-bottom: 1rem;
      border: 1.5px solid transparent;
    }
    .msg.visible { display: block; }
    .msg.error { background: #FEF2F2; border-color: #FECACA; color: #B91C1C; }
    .msg.success { background: #F0FDF4; border-color: #BBF7D0; color: #15803D; }
    .msg.info { background: #EFF6FF; border-color: #BFDBFE; color: #1D4ED8; }

    /* ── Buttons ── */
    .btn-primary {
      width: 100%;
      padding: 0.82rem 1.5rem;
      background: var(--green);
      color: #fff;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: background 0.18s, transform 0.1s;
      margin-top: 0.25rem;
    }
    .btn-primary:hover:not(:disabled) { background: var(--green-dark); }
    .btn-primary:active:not(:disabled) { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    /* ── Footer links ── */
    .footer-links {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.85rem;
      color: #8c7f73;
    }
    .footer-links a, .footer-links button {
      color: var(--green);
      font-weight: 600;
      text-decoration: underline;
      text-decoration-color: transparent;
      transition: text-decoration-color 0.15s;
    }
    .footer-links a:hover, .footer-links button:hover {
      text-decoration-color: var(--green);
    }
    .footer-links .divider { margin: 0 0.5rem; color: #c9bdb2; }

    /* ── Loading spinner (redirecting state) ── */
    .redirecting {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 2rem 2.5rem 2.5rem;
      text-align: center;
    }
    .redirecting.visible { display: flex; }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #ddd;
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .redirecting p { color: var(--brown); font-size: 0.95rem; }
    .redirecting strong { color: var(--green); }

    /* ── Join options (shown when no account found) ── */
    .join-options {
      display: none;
      margin-top: 1.25rem;
      gap: 0.75rem;
      flex-direction: column;
    }
    .join-options.visible { display: flex; }
    .join-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.9rem 1.1rem;
      border: 1.5px solid #ddd5c9;
      border-radius: 12px;
      text-decoration: none;
      color: var(--brown);
      transition: border-color 0.18s, background 0.18s;
    }
    .join-card:hover { border-color: var(--green); background: #f5f5f0; }
    .join-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
    }
    .join-card:nth-child(1) .join-icon { background: #E8F5EE; }
    .join-card:nth-child(2) .join-icon { background: #FDF3E8; }
    .join-card-text strong { display: block; font-size: 0.9rem; font-weight: 700; }
    .join-card-text span { font-size: 0.82rem; color: #8c7f73; }

    /* ── Back link ── */
    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.84rem;
      color: #8c7f73;
    }
    .back-link a { color: var(--green); font-weight: 600; }
  </style>
</head>
<body>

  <div class="card" id="card">

    <div class="card-header">
      <a class="logo-link" href="/">
        <svg viewBox="0 0 100 130" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="50" cy="35" rx="35" ry="30" fill="#fff" opacity="0.9"/>
          <ellipse cx="30" cy="45" rx="28" ry="24" fill="#fff" opacity="0.7"/>
          <ellipse cx="70" cy="45" rx="28" ry="24" fill="#fff" opacity="0.7"/>
          <path d="M47 70 Q46 90 44 110 Q50 112 56 110 Q54 90 53 70 Z" fill="#fff" opacity="0.85"/>
        </svg>
        Big Sister Foundation
      </a>
      <h1>Welcome back</h1>
      <p>Sign in to your volunteer or sponsor account</p>
    </div>

    <!-- Sign in form -->
    <div class="card-body" id="signin-form">
      <div class="msg" id="msg"></div>

      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" autofocus>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
          <span class="pw-toggle" id="pw-toggle">Show</span>
        </div>
      </div>

      <button class="btn-primary" id="signin-btn">Sign In</button>

      <div class="footer-links">
        <button id="forgot-btn">Forgot password?</button>
        <span class="divider">·</span>
        <a href="/">Back to site</a>
      </div>

      <!-- Shown when no account matches -->
      <div class="join-options" id="join-options">
        <a class="join-card" href="/volunteer/">
          <div class="join-icon">🌱</div>
          <div class="join-card-text">
            <strong>Apply to volunteer</strong>
            <span>Join the team — we'll set up your account</span>
          </div>
        </a>
        <a class="join-card" href="/sponsor/">
          <div class="join-icon">💛</div>
          <div class="join-card-text">
            <strong>Become a sponsor</strong>
            <span>Support scholars and get a sponsor dashboard</span>
          </div>
        </a>
      </div>
    </div>

    <!-- Redirecting state -->
    <div class="redirecting" id="redirecting">
      <div class="spinner"></div>
      <p>Signed in as <strong id="redir-email"></strong><br>Taking you to your dashboard…</p>
    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
  (function() {
    'use strict';

    firebase.initializeApp({
      apiKey: "AIzaSyBm-d9DPG4iKbmhEA71E6cBxAHmcVgrdTs",
      authDomain: "big-sister-foundation.firebaseapp.com",
      projectId: "big-sister-foundation",
      storageBucket: "big-sister-foundation.appspot.com",
      messagingSenderId: "374538996840",
      appId: "1:374538996840:web:8e2d02ada8ccba9b69ba1f"
    });
    var auth = firebase.auth();
    var db = firebase.firestore();

    var emailEl = document.getElementById('email');
    var pwEl = document.getElementById('password');
    var pwToggle = document.getElementById('pw-toggle');
    var signinBtn = document.getElementById('signin-btn');
    var forgotBtn = document.getElementById('forgot-btn');
    var msgEl = document.getElementById('msg');
    var joinOptions = document.getElementById('join-options');
    var signinForm = document.getElementById('signin-form');
    var redirecting = document.getElementById('redirecting');

    /* ── Password toggle ── */
    pwToggle.addEventListener('click', function() {
      var isText = pwEl.type === 'text';
      pwEl.type = isText ? 'password' : 'text';
      pwToggle.textContent = isText ? 'Show' : 'Hide';
    });

    /* ── Show message ── */
    function showMsg(text, type) {
      msgEl.textContent = text;
      msgEl.className = 'msg visible ' + (type || 'error');
      joinOptions.classList.remove('visible');
    }
    function clearMsg() {
      msgEl.className = 'msg';
      joinOptions.classList.remove('visible');
    }

    /* ── Route after login ── */
    function routeUser(email) {
      signinForm.style.display = 'none';
      redirecting.classList.add('visible');
      document.getElementById('redir-email').textContent = email;

      // Check volunteer first, then sponsor
      db.collection('volunteers').where('email', '==', email).limit(1).get()
        .then(function(vSnap) {
          if (!vSnap.empty) {
            window.location.href = '/volunteer/portal/';
            return;
          }
          return db.collection('sponsors').where('email', '==', email).limit(1).get();
        })
        .then(function(sSnap) {
          if (!sSnap) return; // already redirected
          if (!sSnap.empty) {
            window.location.href = '/sponsor/dashboard.html';
            return;
          }
          // Not in either collection — signed in but no profile yet
          signinForm.style.display = '';
          redirecting.classList.remove('visible');
          showMsg('We couldn\'t find a volunteer or sponsor profile for this account.', 'info');
          joinOptions.classList.add('visible');
          // Sign them back out so the form resets cleanly
          auth.signOut();
        })
        .catch(function() {
          signinForm.style.display = '';
          redirecting.classList.remove('visible');
          showMsg('Could not verify your account. Please try again.', 'error');
        });
    }

    /* ── Auth state ── */
    auth.onAuthStateChanged(function(user) {
      if (user) {
        routeUser(user.email);
      }
    });

    /* ── Sign in ── */
    function doSignIn() {
      clearMsg();
      var email = emailEl.value.trim();
      var pw = pwEl.value;
      if (!email || !pw) { showMsg('Please enter your email and password.'); return; }
      signinBtn.disabled = true;
      signinBtn.textContent = 'Signing in…';
      auth.signInWithEmailAndPassword(email, pw)
        .catch(function(err) {
          signinBtn.disabled = false;
          signinBtn.textContent = 'Sign In';
          var map = {
            'auth/user-not-found': 'No account found with that email.',
            'auth/wrong-password': 'Incorrect password. Try again.',
            'auth/invalid-email': 'That doesn\'t look like a valid email.',
            'auth/too-many-requests': 'Too many attempts. Please wait a few minutes.',
            'auth/invalid-credential': 'Email or password is incorrect.'
          };
          showMsg(map[err.code] || 'Could not sign in. Check your details and try again.');
        });
    }

    signinBtn.addEventListener('click', doSignIn);
    [emailEl, pwEl].forEach(function(el) {
      el.addEventListener('keydown', function(e) { if (e.key === 'Enter') doSignIn(); });
    });

    /* ── Forgot password ── */
    forgotBtn.addEventListener('click', function() {
      var email = emailEl.value.trim();
      if (!email) { showMsg('Enter your email address above first.'); return; }
      auth.sendPasswordResetEmail(email)
        .then(function() { showMsg('Password reset email sent — check your inbox.', 'success'); })
        .catch(function() { showMsg('Could not send reset email. Check the address.'); });
    });

  })();
  </script>
</body>
</html>
